<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hitler</title>
<meta name="description" content="Hitler - Chat, Grup, & Status">
<meta name="theme-color" content="#4f8f8b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2300a884'/%3E%3Cpath d='M22 16v32M42 16v32M22 32h20' stroke='white' stroke-width='7' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
:root{--bg:#f0f2f5;--panel:#fff;--txt:#111b21;--sub:#667781;--green:#00a884;--me:#d9fdd3;--me-txt:#111b21;--other:#fff;--other-txt:#111b21;--line:#e9edef;--chatbg:#efeae2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0b141a;--panel:#111b21;--txt:#e9edef;--sub:#8696a0;--me:#005c4b;--me-txt:#ffffff;--other:#202c33;--other-txt:#ffffff;--line:#222d34;--chatbg:#0b141a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,BlinkMacSystemFont,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
#auth{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);border-radius:18px;padding:24px;width:100%;max-width:360px;box-shadow:0 8px 30px #0000001a}
.card h1{margin:0 0 4px;font-size:28px;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,#00a884,#6366f1);-webkit-background-clip:text;background-clip:text;color:transparent}
.card p{margin:0 0 16px;color:var(--sub);font-size:14px}
.tabs{display:flex;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:10px;color:var(--sub);border-bottom:3px solid transparent;font-weight:600}
.tabs button.on{color:var(--green);border-color:var(--green)}
.f{width:100%;padding:11px 12px;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.btn{width:100%;padding:11px;background:var(--green);color:#fff;border-radius:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.err{color:#e5484d;font-size:13px;min-height:18px;margin:0 0 8px}
#app{height:100%;display:flex;max-width:1400px;margin:0 auto;background:var(--panel)}
#side{width:380px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
#main{flex:1;display:flex;flex-direction:column;background:var(--chatbg);min-width:0}

.brand-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand-hdr h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-0.6px;background:linear-gradient(135deg,#00a884,#4f46e5,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:center;gap:8px}

.hd{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg)}
.who{display:flex;flex-direction:column;min-width:0;flex:1}
.who b{font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{font-size:11px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small.onl{color:var(--green);font-weight:700}

.ib{width:38px;height:38px;border-radius:50%;font-size:18px;display:inline-flex;align-items:center;justify-content:center}
.ib:hover{background:var(--line)}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;text-transform:uppercase;position:relative}
.av.ring{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--green)}.av.img{background-size:cover;background-position:center;overflow:hidden}.av video{width:100%;height:100%;object-fit:cover;pointer-events:none}.mem{padding:8px 0;display:flex;gap:10px;align-items:center;font-size:14px;border-bottom:1px solid var(--line)}.lnk{font-size:12px;word-break:break-all;background:var(--bg);padding:8px;border-radius:6px;margin:6px 0}
.nav{display:flex;border-top:1px solid var(--line)}#dd{position:absolute;right:10px;top:50px;background:var(--panel);box-shadow:0 4px 16px #0004;border-radius:8px;z-index:5;overflow:hidden}#dd button{display:block;padding:12px 18px;width:100%;text-align:left;white-space:nowrap}.bd{background:var(--green);color:#fff;border-radius:10px;min-width:20px;padding:1px 6px;font-size:12px;display:inline-block;text-align:center}.row .t small{font-size:14px}.row .t small.u{font-size:12px;font-weight:700;color:var(--txt)}.av.big{width:96px;height:96px;font-size:40px}#mb2 button{display:block;width:100%;padding:13px;text-align:left;border-bottom:1px solid var(--line)}.m{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.nav button{flex:1;padding:8px;color:var(--sub);font-weight:600;font-size:12px}
.nav button.on{color:var(--green);box-shadow:inset 0 3px var(--green)}
#list{flex:1;overflow-y:auto}
.row{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line);user-select:none}
.row:hover{background:var(--bg)}
.row .t{flex:1;min-width:0}
.row .t b,.row .t small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--sub)}
.empty{color:var(--sub);text-align:center;padding:30px 16px;font-size:14px}
.sec{padding:8px 14px;font-size:12px;color:var(--green);font-weight:700}
#msgs{flex:1;overflow-y:auto;padding:14px 6%;display:flex;flex-direction:column;gap:5px}

.m{max-width:75%;padding:6px 9px;border-radius:8px;background:var(--other);color:var(--other-txt);box-shadow:0 1px 1px #0002;word-wrap:break-word}
.m.me{align-self:flex-end;background:var(--me);color:var(--me-txt)}
.m .n{font-size:12px;font-weight:700;color:var(--green)}
.m img,.m video{max-width:100%;max-height:260px;border-radius:6px;display:block;margin:2px 0}
.m small{display:block;text-align:right;font-size:10px;color:var(--sub)}

.comp{display:flex;gap:8px;padding:10px;background:var(--bg);align-items:center}
.comp input[type=text]{flex:1;padding:10px 14px;border:0;border-radius:20px;background:var(--panel);color:var(--txt)}
.send{background:var(--green);color:#fff;width:40px;height:40px;border-radius:50%}
.ph{flex:1;display:flex;align-items:center;justify-content:center;color:var(--sub);text-align:center;padding:20px}
.ov{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
.md{background:var(--panel);padding:20px;border-radius:14px;width:100%;max-width:360px}
.md h3{margin:0 0 12px}
#vw{background:#000;flex-direction:column;color:#fff;cursor:pointer}
#vw img,#vw video{max-width:100%;max-height:75%}
.bk{display:none}
@media(max-width:700px){#app{position:relative;overflow:hidden}#side,#main{position:absolute;inset:0;width:100%;border:0;transition:transform .32s cubic-bezier(.2,.8,.2,1)}#main{transform:translateX(100%)}#app.open #main{transform:none}#app.open #side{transform:translateX(-28%)}.bk{display:block}}

button{transition:transform .12s,background .15s,filter .15s}button:active{transform:scale(.95)}
.btn{background:linear-gradient(135deg,#00a884,#4f46e5)}.btn:hover{filter:brightness(1.1)}
.nav button.on{color:var(--green);background:linear-gradient(#00a88414,transparent)}
.row{transition:background .15s,transform .12s}.row:active{transform:scale(.98)}
.av{box-shadow:0 2px 6px #0003}.bd{background:linear-gradient(135deg,#00a884,#ec4899)}
.an{animation:up .28s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}}@keyframes pop{from{opacity:0;transform:scale(.9)}}
#msgs{gap:4px;padding:12px 5%}
.m{align-self:flex-start;width:fit-content;max-width:78%;padding:6px 10px 5px;border-radius:16px 16px 16px 4px;line-height:1.35;overflow-wrap:anywhere;box-shadow:0 1px 3px #0002}
.m.me{align-self:flex-end;border-radius:16px 16px 4px 16px;background:var(--me);color:var(--me-txt)}
.m.me .n{color:var(--me-txt)}.m small{display:inline-block;float:right;margin:7px 0 0 10px;font-size:10px;line-height:1;opacity:.8;color:inherit}
.m::after{content:"";display:table;clear:both}
#msgs .empty{align-self:center;width:fit-content;background:var(--panel);border-radius:10px;padding:4px 12px!important;box-shadow:0 1px 2px #0002}
.comp{background:var(--panel);box-shadow:0 -2px 10px #0001}.comp input[type=text]{background:var(--bg)}
.send{background:linear-gradient(135deg,#00a884,#4f46e5)}
.ov[hidden]{display:flex!important;opacity:0;visibility:hidden;pointer-events:none}
.md{border-radius:18px}
#dd button:hover,#mb2 button:hover{background:var(--bg)}

.sw{height:44px;border-radius:10px;border:2px solid var(--line);font-size:16px}.sw.on{border-color:var(--green);transform:scale(1.06)}
.chip{padding:8px 12px;border-radius:10px;background:var(--bg);font-size:13px;border:1px solid var(--line)}.chip.on{background:var(--green);color:#fff;border-color:transparent}
.lnk{user-select:text}
#ts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#26302ee6;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:999}#ts.on{opacity:1;transform:translate(-50%,0)}
#dg{z-index:120}.av.big{width:100px;height:100px;font-size:44px;box-shadow:0 0 0 4px var(--panel), 0 0 0 6px var(--green)}
#cm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
input[type=range]{width:100%;accent-color:var(--green)}label{font-size:13px;color:var(--sub)}
#cd{position:absolute;right:10px;top:52px;background:var(--panel);box-shadow:0 4px 16px #0004;border-radius:8px;z-index:5;overflow:hidden;transform-origin:top right;transition:opacity .15s,transform .18s,visibility .15s}#main>#cd{position:absolute}#cd[hidden]{display:block!important;opacity:0;visibility:hidden;transform:scale(.85)}#cd button{display:block;padding:12px 18px;width:100%;text-align:left;white-space:nowrap}#cd button:hover{background:var(--bg)}
.vf{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#1d9bf0;color:#fff;font-size:10px;vertical-align:middle;margin-left:4px;box-shadow:0 1px 3px #0003}
#main>#cd{position:absolute;z-index:40}#dd{z-index:40}
#cd,#dd{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px #00000040;padding:6px;min-width:200px}
#cd button,#dd button{border-radius:10px;padding:11px 14px;font-size:14px}
#cd button:hover,#dd button:hover{background:#00a88422}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#8884;border-radius:6px}
#msgs{scroll-behavior:smooth}
.m{font-size:15px;border-radius:18px 18px 18px 6px}.m.me{border-radius:18px 18px 6px 18px}
.hd{padding:10px 14px}
.comp input[type=text]:focus,#q:focus{outline:2px solid #00a88466}
.send{width:44px;height:44px;font-size:16px}
.row{padding:11px 12px}.row:hover{background:#00a88414}
.vt{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;max-width:260px;margin:2px 0}.vt video{display:block;width:100%;max-height:260px;object-fit:cover;pointer-events:none;background:#000}.vt span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;background:#0003;text-shadow:0 2px 8px #0008}
.im{cursor:zoom-in}.au{font-size:13px;margin-bottom:4px}.m audio{width:240px;max-width:100%;height:38px;display:block;margin:2px 0 4px}
.fl{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:#0000001a;color:inherit;text-decoration:none;min-width:200px;font-size:26px;margin:2px 0}.m.me .fl{background:#ffffff26}.fl span{display:flex;flex-direction:column;font-size:14px;overflow:hidden}.fl b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fl em{font-style:normal;font-size:11px;opacity:.75}
#mv{position:fixed;inset:0;background:#000;z-index:150;display:flex;flex-direction:column;color:#fff;transition:opacity .22s,visibility .22s}#mv[hidden]{display:flex!important;opacity:0;visibility:hidden;pointer-events:none}
.mvh{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px))}.mvh button{width:40px;height:40px;border-radius:50%;background:#ffffff26;font-size:20px;color:#fff}
#mvc{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding-bottom:env(safe-area-inset-bottom,0px)}#mvc video,#mvc img{max-width:100%;max-height:100%}
#main>#ad{position:absolute;z-index:40;left:12px;bottom:74px}#ad{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px #00000040;padding:6px;min-width:170px;transform-origin:bottom left;transition:opacity .15s,transform .18s,visibility .15s}#ad[hidden]{display:block!important;opacity:0;visibility:hidden;transform:translateY(10px) scale(.92)}#ad button{display:block;width:100%;text-align:left;padding:11px 14px;border-radius:10px;font-size:14px}#ad button:hover{background:#00a88422}
.m img{max-width:100%;max-height:360px;width:auto;height:auto;object-fit:contain}.vt{width:260px;max-width:100%}.vt video{width:100%;height:auto;min-height:140px;max-height:360px;object-fit:contain}

.acct-card{background:var(--panel);border-radius:20px;padding:24px 16px;box-shadow:0 10px 30px #0001;border:1px solid var(--line);margin:12px 14px;text-align:center}
.acct-btn{width:100%;padding:14px;margin-top:10px;border-radius:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;box-shadow:0 4px 12px #0001}
.prv-item{display:flex;align-items:center;justify-content:space-between;padding:16px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.prv-item:hover{background:var(--bg)}
.prv-item .t{display:flex;flex-direction:column;gap:3px;text-align:left}
.prv-item .t b{font-size:15px;color:var(--txt)}
.prv-item .t small{font-size:13px;color:var(--sub)}

.switch-ui{position:relative;display:inline-block;width:52px;height:28px;flex:none}
.switch-ui input{opacity:0;width:0;height:0}
.slider-ui{position:absolute;cursor:pointer;inset:0;background-color:#667781;transition:.3s cubic-bezier(0.4, 0, 0.2, 1);border-radius:28px}
.slider-ui:before{position:absolute;content:"";height:22px;width:22px;left:3px;bottom:3px;background-color:white;transition:.3s cubic-bezier(0.4, 0, 0.2, 1);border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,0.3)}
input:checked + .slider-ui{background-color:#00a884}
input:checked + .slider-ui:before{transform:translateX(24px)}

.owner-user-card{background:var(--bg);border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--line)}
.owner-user-card .hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.owner-btn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}

.opt-table{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.opt-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:10px;background:var(--bg);cursor:pointer;border:1px solid var(--line);text-align:left;width:100%}
.opt-row.on{border-color:var(--green);background:#00a88415}
.opt-row span{font-size:14px;font-weight:500;color:var(--txt)}
.opt-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--sub);display:flex;align-items:center;justify-content:center}
.opt-row.on .opt-radio{border-color:var(--green);background:var(--green)}
.opt-row.on .opt-radio:after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}

.shb-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.shb-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:600;width:100%;text-align:left}
.shb-item:hover{background:#00a88414}
.shb-item.dg{color:#e5484d;background:#e5484d14;border-color:#e5484d44}
</style>
</head>
<body>
<div id="auth">
 <div class="card">
  <h1><svg class="logo" viewBox="0 0 64 64" aria-hidden="true" style="width:40px;height:40px;vertical-align:middle;margin-right:6px"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00c9a7"/><stop offset="1" stop-color="#4f46e5"/></linearGradient></defs><path d="M14 6h36a10 10 0 0 1 10 10v22a10 10 0 0 1-10 10H31L17 59V48h-3A10 10 0 0 1 4 38V16A10 10 0 0 1 14 6z" fill="url(#lg)"/><path d="M22 17v22M42 17v22M22 28h20" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/></svg>Hitler</h1>
  <p>Chat pribadi, grup &amp; status</p>
  <div class="tabs"><button id="tl" class="on" type="button">Masuk</button><button id="tr" type="button">Daftar</button></div>
  <input class="f" id="em" type="email" placeholder="Email" style="display:none;">
  <input class="f" id="us" placeholder="Username atau email">
  <input class="f" id="pw" type="password" placeholder="Password (min. 6 karakter)">
  <p class="err" id="er"></p>
  <button class="btn" id="go" type="button">Masuk</button>
 </div>
</div>

<div id="app" hidden>
 <aside id="side">
  <div class="brand-hdr">
    <h1><svg viewBox="0 0 64 64" aria-hidden="true" style="width:28px;height:28px"><path d="M14 6h36a10 10 0 0 1 10 10v22a10 10 0 0 1-10 10H31L17 59V48h-3A10 10 0 0 1 4 38V16A10 10 0 0 1 14 6z" fill="url(#lg)"/><path d="M22 17v22M42 17v22M22 28h20" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/></svg>Hitler</h1>
    <div style="position:relative">
      <button class="ib" id="mb" title="Menu">⋮</button>
      <div id="dd" hidden>
        <button id="toggleTheme">🌙 / ☀️ Ganti Tema</button>
        <button id="cn2">💬 Chat baru</button>
        <button id="ng">👥 Grup baru</button>
        <button id="wpm">🎨 Ubah wallpaper</button>
      </div>
    </div>
  </div>
  <div id="list"></div>
  <div class="nav"><button id="nc" class="on">💬<br>Chat</button><button id="nr">👥<br>Grup</button><button id="ns">⭕<br>Status</button><button id="na">👤<br>Akun</button></div>
 </aside>
 <main id="main"><div class="ph">Pilih chat atau cari username<br>untuk mulai mengobrol 💬</div></main>
</div>

<div class="ov" id="cnm" hidden><div class="md">
  <h3>Chat Baru</h3>
  <input class="f" id="q" placeholder="🔍 Cari username..." style="margin-bottom:12px">
  <div id="cnlist" style="max-height:300px;overflow-y:auto"></div>
  <button class="btn" id="cnx" style="background:var(--line);color:var(--txt);margin-top:10px">Batal</button>
</div></div>

<!-- Modal Teruskan Pesan -->
<div class="ov" id="fwdm" hidden><div class="md">
  <h3>Teruskan Pesan Ke</h3>
  <button class="btn" id="fwd_status" style="margin-bottom:10px;background:linear-gradient(135deg,#ec4899,#a855f7)">⭕ Jadikan Status Saya</button>
  <div class="sec" style="padding-left:0">OBROLAN SAYA</div>
  <div id="fwdlist" style="max-height:260px;overflow-y:auto"></div>
  <button class="btn" id="fwdx" style="background:var(--line);color:var(--txt);margin-top:10px">Batal</button>
</div></div>

<input type="file" id="sf" accept="image/*,video/*" hidden>
<input type="file" id="af" accept="image/*,video/*" hidden>

<div class="ov" id="gm" hidden><div class="md"><h3>Grup baru</h3>
 <div style="text-align:center;margin-bottom:10px"><div id="gmp" class="gmp" title="Pilih foto grup">📷</div><br><small style="color:var(--sub)">Foto grup (opsional)</small></div>
 <input class="f" id="gn" placeholder="Nama grup">
 <input class="f" id="gbio" placeholder="Deskripsi / Bio grup (opsional)">
 <input class="f" id="gu" placeholder="Username anggota, pisah koma">
 <p class="err" id="ge"></p>
 <button class="btn" id="gc">Buat grup</button>
 <input class="f" id="gl" placeholder="…atau tempel link undangan grup" style="margin-top:12px"><button class="btn" id="gj">Gabung via link</button>

function sha256hex(ascii){
 function rr(v,a){return (v>>>a)|(v<<(32-a))}
 const mp=Math.pow,mx=mp(2,32);let res='';
 const words=[],bl=ascii.length*8;
 let hash=[],k=[],pc=0,cmp={};
 for(let c=2;pc<64;c++){if(!cmp[c]){for(let i=0;i<313;i+=c)cmp[i]=(mp(c,.5)*mx)|0;hash[pc]=(mp(c,.5)*mx)|0;k[pc++]=(mp(c,1/3)*mx)|0}}
 ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
 for(let i=0;i<ascii.length;i++){const j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}
 words[words.length]=((bl/mx)|0);words[words.length]=(bl);
 for(let j=0;j<words.length;){
  const w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);
  for(let i=0;i<64;i++){
   const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
   const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
   const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;
  }
  for(let i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0;
 }
 for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}
 return res}
async function hash(s){
  try{
    if (window.crypto && crypto.subtle) {
      const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
      return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return sha256hex(unescape(encodeURIComponent(s)));
}

function canSeeFeature(targetUser, featureKey) {
  if (targetUser === me) return true;
  const targetPriv = ((db.users[targetUser] || {}).priv || {})[featureKey] || { mode: 'all' };
  const mode = targetPriv.mode || 'all';
  const list = targetPriv.list || [];

  if (mode === 'all') return true;
  if (mode === 'nobody') return false;
  if (mode === 'except') return !list.includes(me);
  if (mode === 'only') return list.includes(me);
  return true;
}

function presText(u){
  if(BOTS.includes(u))return {t:'bot · selalu online',on:1};
  if(!canSeeFeature(u, 'online')) return null;
  load();
  const p = (db.pres||{})[u];
  if(!p) return {t:'Offline',on:0};
  if(p.on && Date.now()-p.t < 35000) return {t:'Online',on:1};
  return {t:'Terakhir dilihat '+lsFmt(p.t),on:0};
}

function prep(f){return new Promise(ok=>{
 if(f.type.startsWith('video/')){
  const r=new FileReader();r.onload=()=>ok({type:'v',src:r.result});r.readAsDataURL(f)}
 else if(f.type.startsWith('image/')){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{
  const c=document.createElement('canvas');c.width=i.width;c.height=i.height;
  c.getContext('2d').drawImage(i,0,0);ok({type:'i',src:c.toDataURL('image/jpeg',.9)})};i.src=r.result};r.readAsDataURL(f)}
 else ok(null)})}

const tx=async(mode,fn)=>{const d=await idb;return new Promise((ok,no)=>{const t=d.transaction('m',mode),q=fn(t.objectStore('m'));t.oncomplete=()=>ok(q.result);t.onerror=()=>no(t.error)})};

const HELP='Halo! 👋 Saya bot downloader.\nKirim link TikTok, Instagram Reels, atau YouTube, nanti saya unduhkan otomatis.\nTambahkan kata "mp3" di pesan untuk ambil audionya saja.\nKetik /bantuan untuk melihat pesan ini lagi.';
const RX_TT=/https?:\/\/(?:[\w-]+\.)?tiktok\.com\/\S+/i,RX_YT=/https?:\/\/(?:(?:www|m|music)\.)?(?:youtube\.com\/(?:watch|shorts|live)\S*|youtu\.be\/\S+)/i,RX_IG=/https?:\/\/(?:www\.)?instagram\.com\/(?:reel|reels|p)\/[\w-]+\/?/i;

function botSay(cid,m){const bid=code()+code();botPatch(cid,c=>c.msgs.push({f:BOT,t:Date.now(),r:[],bid,...m}));return bid}

async function ttGet(url){
 const r=await fetch('https://www.tikwm.com/api/?hd=1&url='+encodeURIComponent(url)),j=await r.json();
 if(!j||j.code!==0||!j.data)throw new Error((j&&j.msg)||'Video tidak ditemukan');
 const d=j.data,abs=u=>u?(/^https?:/.test(u)?u:'https://www.tikwm.com'+u):'';
 return{title:d.title||'',author:(d.author&&d.author.unique_id)||'',video:abs(d.hdplay||d.play),music:abs(d.music),images:(d.images||[]).slice(0,6)}}

async function ytGet(url,audio){
 const cf=db.botcfg||{};if(!cf.api)throw new Error('NOCFG');
 const h={Accept:'application/json','Content-Type':'application/json'};if(cf.key)h.Authorization='Api-Key '+cf.key;
 const r=await fetch(cf.api,{method:'POST',headers:h,body:JSON.stringify({url,videoQuality:'720',downloadMode:audio?'audio':'auto',audioFormat:'mp3'})}),j=await r.json();
 if(j.status==='error')throw new Error((j.error&&j.error.code)||'Gagal memproses');
 if(j.url)return{url:j.url,fn:j.filename};
 if(j.status==='picker'&&j.picker&&j.picker[0])return{url:j.picker[0].url};
 throw new Error('Respons API tidak dikenali')}

async function igGet(url){
 const r=await fetch('https://api.vkrdown.com/v4/media?url='+encodeURIComponent(url));
 const j=await r.json();
 if(!j||!j.data||!j.data.media)throw new Error('Gagal mengunduh Reels Instagram');
 const v=j.data.media.find(m=>m.type==='video')||j.data.media[0];
 return {url:v.url,title:j.data.title||'Instagram Reels'}}

async function grab(u,mt,fn){
 try{const r=await fetch(u);if(!r.ok)throw 0;const b=await r.blob();const mid=await mput(b);urls.set(mid,URL.createObjectURL(b));return{mid,mt,fn,fs:b.size}}
 catch(e){return{media:u,mt,fn,fs:0}}}

 setTimeout(()=>{botPatch(cid,cc=>{const r=b==='botai'?aiReply(cc,msg.text):csReply(msg);cc.msgs.push({f:b,t:Date.now(),r:[],text:r})})},500+Math.random()*700)}

async function botHandle(cid,msg){
 const c=db.chats[cid],t=msg.text,tk=t.match(RX_TT),yt=t.match(RX_YT),ig=t.match(RX_IG);
 await wait(400);
 botPatch(cid,c=>{const m=c.msgs.find(x=>x.t===msg.t&&x.f===msg.f);if(m&&!(m.r=m.r||[]).includes(BOT))m.r.push(BOT)});
 if(!tk&&!yt&&!ig){if(c.type==='p')botSay(cid,{text:HELP});return}
 const url=(tk||yt||ig)[0].replace(/[).,!?]+$/,''),audio=/\b(mp3|audio|musik|lagu)\b/i.test(t.replace(url,'')),name=tk?'TikTok':yt?'YouTube':'Instagram';
 const bid=botSay(cid,{text:'⏳ Mengunduh '+name+(audio?' (audio)':'')+'…'});
 try{
  if(tk){
   const d=await ttGet(url),cap='🎬 '+(d.title||'TikTok')+(d.author?'\n👤 @'+d.author:''),base='tiktok_'+(d.author||'video');
   if(audio){if(!d.music)throw new Error('Audio tidak tersedia');botEdit(cid,bid,{text:cap,...await grab(d.music,'a',base+'.mp3')})}
   else if(d.video)botEdit(cid,bid,{text:cap,...await grab(d.video,'v',base+'.mp4')});
   else if(d.images.length){botEdit(cid,bid,{text:cap,...await grab(d.images[0],'i',base+'_1.jpg')});
    for(let i=1;i<d.images.length;i++)botSay(cid,await grab(d.images[i],'i',base+'_'+(i+1)+'.jpg'))}
   else throw new Error('Media tidak ditemukan')
  }else if(ig){
   const d=await igGet(url);
   botEdit(cid,bid,{text:'📸 IG Reels: '+(d.title||''),...await grab(d.url,audio?'a':'v','instagram.'+(audio?'mp3':'mp4'))});
  }else{
   const d=await ytGet(url,audio);
   botEdit(cid,bid,{text:'▶️ YouTube',...await grab(d.url,audio?'a':'v',d.fn||'youtube.'+(audio?'mp3':'mp4'))})
  }
 }catch(e){
  const m=String(e&&e.message||e);
  botEdit(cid,bid,{text:m==='NOCFG'?'⚠️ Unduhan YouTube belum diaktifkan. Pemilik bot perlu login sebagai @'+BOT+' → tab Akun → isi endpoint API.':/fetch|network|load/i.test(m)?'❌ Gagal menghubungi layanan unduhan (jaringan atau diblokir CORS). Coba lagi nanti.':'❌ Gagal mengunduh: '+m})
 }}

function solveLesson(input){
  const s = input.toLowerCase();
  
  // Hitung Matematika Sederhana
  try {
    if(/^[0-9+\-*/().\s^%]+$/.test(input.replace(/[a-zA-Z]/g,'').trim()) && /[\d]/.test(input)){
      const expr = input.replace(/x/g, '*').replace(/\^/g, '**');
      const res = Function('"use strict";return (' + expr + ')')();
      if(typeof res === 'number' && !isNaN(res)) return `🧮 **Hasil Matematika:**\n${input} = **${res}**`;
    }
  }catch(e){}

  if(s.includes('sejarah') || s.includes('proklamasi') || s.includes('perang')){
    return "📚 **Jawaban Sejarah:**\nProklamasi Kemerdekaan Indonesia dilaksanakan pada 17 Agustus 1945 oleh Soekarno-Hatta di Jalan Pegangsaan Timur No. 56, Jakarta. Peristiwa penting terkait mencakup Rengasdengklok dan perumusan naskah proklamasi di rumah Laksamana Maeda.";
  }
  if(s.includes('fotosintesis') || s.includes('biologi') || s.includes('sel')){
    return "🌿 **Jawaban Biologi:**\nFotosintesis adalah proses pembuat makanan oleh tumbuhan hijau menggunakan cahaya matahari, air ($H_2O$), dan karbon dioksida ($CO_2$), menghasilkan glukosa ($C_6H_{12}O_6$) serta oksigen ($O_2$).";
  }
  if(s.includes('gravitasi') || s.includes('ipa') || s.includes('fisika') || s.includes('kimia')){
    return "⚛️ **Jawaban IPA / Fisika:**\nHukum Gravitasi Newton menyatakan bahwa setiap dua benda bermassa akan tarik-menarik dengan gaya yang berbanding lurus dengan perkalian massanya dan berbanding terbalik dengan kuadrat jaraknya ($F = G \\frac{m_1 m_2}{r^2}$).";
  }
  return null;
}

  document.body.appendChild(d);const c=d.querySelector('#ec'),g=c.getContext('2d'),W=300,q=x=>d.querySelector(x);let z=1,ox=0,oy=0,sq=!!o.circle;

  function draw(){const s=sc(),w=im.width*s,h=im.height*s;if(sq){const mx=(w-W)/2,my=(h-W)/2;ox=Math.max(-mx,Math.min(mx,ox));oy=Math.max(-my,Math.min(my,oy))}else ox=oy=0;g.fillStyle='#000';g.fillRect(0,0,W,W);g.drawImage(im,(W-w)/2+ox,(W-h)/2+oy,w,h)}
  let px=null,py=0;c.onpointerdown=e=>{px=e.clientX;py=e.clientY;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(px===null||!sq)return;const k=W/c.clientWidth;ox+=(e.clientX-px)*k;oy+=(e.clientY-py)*k;px=e.clientX;py=e.clientY;draw()};c.onpointerup=()=>px=null;
  if(q('#ez'))q('#ez').oninput=e=>{z=+e.target.value;draw()};if(q('#es'))q('#es').onchange=e=>{sq=e.target.checked;z=1;ox=oy=0;draw()};
  const end=v=>{d.remove();URL.revokeObjectURL(u0);res(v)};q('#ex').onclick=()=>end(null);

   if(sq){const side=Q?Math.min(Q,Math.round(W/s)):Math.round(W/s),sx=-((W-im.width*s)/2+ox)/s,sy=-((W-im.height*s)/2+oy)/s;oc.width=oc.height=side;x.drawImage(im,sx,sy,W/s,W/s,0,0,side,side)}
   else{const k=Q?Math.min(1,Q/Math.max(im.width,im.height)):1;oc.width=Math.round(im.width*k);oc.height=Math.round(im.height*k);x.drawImage(im,0,0,oc.width,oc.height)}
   oc.toBlob(b=>end(b),'image/jpeg',Q>=1440||!Q?.95:.88)};draw()}
 im.src=u0})}

function bindMic(){const b=$('#sd');let t0=0,y0=0;
 b.onclick=()=>{if($('#tx').value.trim())send()};
 b.onpointerdown=e=>{if($('#tx').value.trim()||!canSend())return;e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(x){}t0=Date.now();y0=e.clientY;vnStart()};
 b.onpointermove=e=>{if(vn&&!vn.lock&&y0-e.clientY>50)vnLock(1)};
 b.onpointerup=()=>{if(!vn||vn.lock)return;Date.now()-t0<350?vnLock(1):vnStop(1)};
 b.onpointercancel=()=>vnStop(0);
 $('#vl').onclick=()=>vnLock(vn&&!vn.lock?1:0);$('#vc').onclick=()=>vnStop(0);$('#vs').onclick=()=>vnStop(1)}
function vnLock(l){if(!vn)return;vn.lock=l;$('#vl').textContent=l?'🔒 Terkunci':'🔓 Kunci';$('#vh').textContent=l?'Rekaman terkunci · tekan ⏹ untuk kirim':'Lepas untuk kirim · geser ke atas untuk kunci'}
async function vnStart(){const v=vn={lock:0,t:Date.now()};$('.comp').classList.add('rec');vnLock(0);
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});if(vn!==v){st.getTracks().forEach(t=>t.stop());return}const mr=new MediaRecorder(st);v.ch=[];v.st=st;v.mr=mr;mr.ondataavailable=e=>e.data.size&&v.ch.push(e.data);mr.start();v.t=Date.now();
  v.iv=setInterval(()=>{const s=Math.floor((Date.now()-v.t)/1000);$('#vt').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},250)}
 catch(e){if(vn===v){vn=null;$('.comp').classList.remove('rec')}toast('Mikrofon tidak tersedia / izin ditolak')}}
function vnStop(send){if(!vn)return;const v=vn;vn=null;clearInterval(v.iv);$('.comp').classList.remove('rec');$('#vt').textContent='0:00';if(!v.mr)return;
 v.mr.onstop=async()=>{v.st.getTracks().forEach(t=>t.stop());if(!send||!v.ch.length||Date.now()-v.t<700||!cur)return;const b=new Blob(v.ch,{type:v.mr.mimeType||'audio/webm'});const src=await b2d(b);const mid=await mput(b).catch(()=>null);if(mid)urls.set(mid,src);push({mid,src,mt:'a',vn:1,fn:'Pesan suara',fs:b.size})};v.mr.stop()}

function ownerPanel(){
  if(me!=='riyan')return;
  const d=document.createElement('div');
  d.className='ov';d.style.zIndex=120;
  
  const R=()=>{
    load();
    const usersList = Object.keys(db.users).filter(u=>u!==me&&!BOTS.includes(u));
    d.innerHTML=`<div class="md" style="max-width:440px;max-height:90vh;overflow:auto">
      <h3 style="display:flex;align-items:center;gap:8px">🛡️ Panel Owner</h3>
      ${usersList.map(u=>{
        const x=db.users[u];
        return `<div class="owner-user-card">
          <div class="hdr">
            <b>@${esc(u)}${vb(u)}</b>
            <small style="color:var(--sub)">${x.ban?'🚫 Banned':x.frz>Date.now()?'❄️ Beku':''}</small>
          </div>
          <div style="font-size:12px;color:var(--sub);margin-bottom:6px">${esc(x.email)}</div>
          <div class="owner-btn-grid">
            <button class="chip" data-a="resetpw" data-u="${u}">🔑 Reset PW</button>
            <button class="chip" data-a="frz" data-u="${u}">❄️ Bekukan</button>
            <button class="chip" data-a="badge" data-u="${u}">✔ Centang</button>
            <button class="chip" data-a="ban" data-u="${u}" style="color:${x.ban?'var(--green)':'#f5b301'}">${x.ban?'Unban':'🚫 Ban'}</button>
          </div>
          <button class="chip" data-a="delacc" data-u="${u}" style="width:100%;margin-top:6px;background:#e5484d;color:#fff;border-color:transparent">🗑️ Hapus Akun</button>
        </div>`;
      }).join('')||'<div class="empty">Belum ada user terdaftar</div>'}
      <button class="btn" id="oxx" style="margin-top:10px">Tutup Panel</button>
    </div>`;
  };
  
  R();
  document.body.appendChild(d);
  
  d.onclick=async e=>{
    if(e.target===d||e.target.id==='oxx')return d.remove();
    const b=e.target.closest('[data-a]');
    if(!b)return;
    const u=b.dataset.u, act=b.dataset.a;
    load();
    const x=db.users[u];

    if(act==='delacc'){
      if(!await ask('Yakin hapus akun @'+u+' secara permanen?',{ok:'Hapus Permanen'})) return;
      delete db.users[u];
      delete db.pres[u];
      Object.keys(db.chats).forEach(cid=>{
        const c=db.chats[cid];
        if(c.members.includes(u)){
          if(c.type==='p'){
            delete db.chats[cid];
          } else {
            c.members = c.members.filter(m=>m!==u);
            c.admins = (c.admins||[]).filter(m=>m!==u);
          }
        }
      });
      db.status = db.status.filter(s=>s.u!==u);
      save();
      toast('Akun @'+u+' berhasil dihapus');
      R();
      renderSide();
    } else if(act==='resetpw'){
      const newpass = await ask('Masukkan password baru untuk @'+u,{input:1,ok:'Ganti'});
      if(!newpass||newpass.length<6) return toast('Password min. 6 karakter');
      x.pass = await hash(newpass);
      save();
      toast('Password @'+u+' berhasil diubah!');
    } else if(act==='ban'){
      x.ban = !x.ban;
      save();
      R();
    } else if(act==='frz'){
      if(x.frz > Date.now()){
        delete x.frz;
        toast('Sanksi bekukan dicairkan');
      } else {
        const modal = document.createElement('div');
        modal.className = 'ov'; modal.style.zIndex = 130;
        modal.innerHTML = `<div class="md">
          <h3>Bekukan @${esc(u)}</h3>
          <input class="f" id="fzval" type="number" placeholder="Jumlah durasi" value="10">
          <select class="f" id="fzunit">
            <option value="s">Detik</option>
            <option value="m">Menit</option>
            <option value="h" selected>Jam</option>
            <option value="d">Hari</option>
            <option value="y">Tahun</option>
          </select>
          <button class="btn" id="fzg">Terapkan Bekukan</button>
          <button class="btn" id="fzx" style="background:var(--line);color:var(--txt);margin-top:6px">Batal</button>
        </div>`;
        document.body.appendChild(modal);
        modal.querySelector('#fzx').onclick = ()=> modal.remove();
        modal.querySelector('#fzg').onclick = ()=>{
          const val = +modal.querySelector('#fzval').value || 1;
          const unit = modal.querySelector('#fzunit').value;
          const msMap = {s: 1000, m: 60000, h: 3600000, d: 86400000, y: 31536000000};
          x.frz = Date.now() + (val * msMap[unit]);
          save();
          modal.remove();
          toast('Akun dibekukan!');
          R();
        };
      }
    } else if(act==='badge'){
      const modal = document.createElement('div');
      modal.className = 'ov'; modal.style.zIndex = 130;
      modal.innerHTML = `<div class="md">
        <h3>Atur Centang @${esc(u)}</h3>
        <button class="chip" style="width:100%;margin-bottom:6px;background:#1d9bf0;color:#fff" data-c="blue">✔ Centang Biru</button>
        <button class="chip" style="width:100%;margin-bottom:6px;background:#e5484d;color:#fff" data-c="red">✔ Centang Merah</button>
        <button class="chip" style="width:100%;margin-bottom:6px;background:#f5b301;color:#fff" data-c="yellow">✔ Centang Kuning</button>
        <button class="chip" style="width:100%;margin-bottom:12px;background:#555;color:#fff" data-c="del">🗑 Hapus Centang</button>
        <button class="btn" id="bgx" style="background:var(--line);color:var(--txt)">Batal</button>
      </div>`;
      document.body.appendChild(modal);
      modal.querySelector('#bgx').onclick = ()=> modal.remove();
      modal.onclick = e_b =>{
        const btn = e_b.target.closest('[data-c]');
        if(!btn) return;
        const color = btn.dataset.c;
        if(color==='del') delete x.badge;
        else x.badge = color;
        save();
        modal.remove();
        toast('Centang diperbarui');
        R();
      };
    }
  };
}

        </div>
      </div>
      <button class="btn" id="clx" style="margin-top:8px;background:var(--line);color:var(--txt)">Batal</button>
    </div>`;

    document.body.appendChild(modal);
    modal.querySelector('#clx').onclick = ()=> modal.remove();

    modal.onclick = async e_opt =>{
      const opt = e_opt.target.closest('[data-m]');
      if(!opt) return;
      const mode = opt.dataset.m;
      load();
      db.users[me].priv = db.users[me].priv||{};

      if(mode==='all'||mode==='nobody'){
        db.users[me].priv[key] = { mode, list:[] };
        save();
        modal.remove();
        R();
      } else {
        const title = mode==='except'?'Sembunyikan dari':'Bagikan hanya dengan';
        const chosen = await pickUsers(title, curPriv.list||[], 'Simpan');
        if(chosen!==null){
          db.users[me].priv[key] = { mode, list: chosen };
          save();
        }
        modal.remove();
        R();
      }
    };
  };
}

function sheet(title,btns){
  const d=document.createElement('div');d.className='ov';d.style.zIndex=110;
  d.innerHTML=`<div class="md" style="max-width:340px;padding:16px"><h3 style="margin:0 0 10px;text-align:left">${esc(title)}</h3>
    <div class="shb-list">
      ${btns.map((b,i)=>`<button class="shb-item ${b.cls||''}" data-i="${i}">${b.t}</button>`).join('')}
      <button class="shb-item" data-i="x" style="justify-content:center;background:var(--line);color:var(--txt);margin-top:4px">Batal</button>
    </div>
  </div>`;
  document.body.appendChild(d);
  d.onclick=e=>{
    const b=e.target.closest('[data-i]');
    if(e.target!==d&&!b)return;
    d.remove();
    if(b&&b.dataset.i!=='x')btns[+b.dataset.i].f();
  };
}

async function takeFile(inp){const f=inp.files&&inp.files[0];if(!f){inp.value='';return null}
 inp.value='';return f}

const refreshAll=()=>{renderSide();if(cur&&db.chats[cur])renderChat()};

function showPic(src){vs=[];vi=0;$('#vw').innerHTML=`<img src="${src}" style="max-height:85%;border-radius:16px">`;$('#vw').hidden=false}

function profMenu(){
 load();
 const u=db.users[me]||{},o=[{t:'📷 Pilih foto baru',f:()=>$('#pf').click()}];
 if(u.pic){o.push({t:'👁 Lihat foto profil',f:()=>showPic(u.pic)},{t:'🗑 Hapus foto profil',cls:'dg',f:()=>{load();delete db.users[me].pic;if(save()){refreshAll();toast('Foto profil dihapus')}}})}
 sheet('Foto profil',o)
}

const lsFmt=t=>{const d=new Date(t),n=new Date(),y=new Date(n);y.setDate(n.getDate()-1);const same=(a,b)=>a.toDateString()===b.toDateString();return same(d,n)?'hari ini '+hm(t):same(d,y)?'kemarin '+hm(t):d.toLocaleDateString('id-ID',{day:'numeric',month:'short'})+' '+hm(t)};

const sidOf=s=>s.id||s.u+'@'+s.t;
function stvAllowed(o,v){if(o===v)return true;const s=((db.users[o]||{}).priv||{}).status||{mode:'all'},l=s.list||[];return s.mode==='only'?l.includes(v):s.mode==='except'?!l.includes(v):s.mode==='nobody'?false:true}
const canSeeS=(s,v=me)=>stvAllowed(s.u,v)||(s.tags||[]).includes(v);
const visS=u=>db.status.filter(s=>s.u===u&&Date.now()-s.t<864e5&&canSeeS(s));
const tagInfo=s=>{const t=s.tags||[];if(!t.length)return '';if(s.u===me)return `<div class="stg">🏷 Ditandai: ${t.map(x=>'@'+esc(x)).join(', ')}</div>`;return t.includes(me)?'<div class="stg">🏷 Kamu ditandai di status ini</div>':''};

function pickUsers(title,preset,ok){return new Promise(res=>{load();const d=document.createElement('div');d.className='ov';d.style.zIndex=140;const sel=new Set(preset||[]);
 const all=Object.keys(db.users).filter(u=>u!==me&&!BOTS.includes(u)),near=[...new Set(myChats().filter(c=>c.type==='p').map(cname))].filter(u=>all.includes(u));
 const list=[...near,...all.filter(u=>!near.includes(u)).sort()];
 d.innerHTML=`<div class="md pk"><h3>${esc(title)}</h3><input class="f" id="pks" placeholder="🔍 Cari username" autocomplete="off"><div class="pkl" id="pkl"></div><button class="btn" id="pko"></button><button class="btn" id="pkx" style="background:var(--line);color:var(--txt);margin-top:8px">Batal</button></div>`;
 document.body.appendChild(d);const q=x=>d.querySelector(x),cnt=()=>{q('#pko').textContent=ok+' ('+sel.size+')'};
 const R=()=>{const t=q('#pks').value.trim().toLowerCase().replace('@',''),v=list.filter(u=>u.includes(t));
  q('#pkl').innerHTML=v.length?v.map(u=>`<label class="pkr">${av(u)}<b>@${esc(u)}</b><input type="checkbox" data-u="${esc(u)}" ${sel.has(u)?'checked':''}></label>`).join(''):'<div class="empty">Tidak ada pengguna lain</div>';cnt()};
 q('#pks').oninput=R;q('#pkl').onchange=e=>{const u=e.target.dataset.u;if(!u)return;e.target.checked?sel.add(u):sel.delete(u);cnt()};
 q('#pko').onclick=()=>{d.remove();res([...sel])};q('#pkx').onclick=()=>{d.remove();res(null)};R()})}

function composeS(f,mt){return new Promise(res=>{const d=document.createElement('div');d.className='ov';d.style.zIndex=110;let tags=[];const u0=URL.createObjectURL(f);
 d.innerHTML=`<div class="md" style="max-width:360px;max-height:92vh;overflow:auto"><h3>Status baru</h3><div class="csp">${mt==='v'?`<video src="${u0}#t=0.1" muted playsinline></video>`:`<img src="${u0}">`}</div><input class="f" id="csc" placeholder="Keterangan status (opsional)" maxlength="200" style="margin-top:10px"><button class="cb" id="cst"></button><button class="btn" id="cso">Posting</button><button class="btn" id="csx" style="background:var(--line);color:var(--txt);margin-top:8px">Batal</button></div>`;
 document.body.appendChild(d);const q=x=>d.querySelector(x);
 const R=()=>{load();q('#cst').textContent=tags.length?'🏷 '+tags.length+' orang ditandai · ubah':'🏷 Tandai orang'};
 const fin=v=>{d.remove();URL.revokeObjectURL(u0);res(v)};
 q('#cst').onclick=async()=>{const r=await pickUsers('Tandai di status',tags,'Tandai');if(r)tags=r;R()};
 q('#cso').onclick=()=>fin({cap:q('#csc').value.trim(),tags});q('#csx').onclick=()=>fin(null);R()})}

function tagMsg(u,st){const id='p:'+[me,u].sort().join(':');if(!db.chats[id])db.chats[id]={id,type:'p',members:[me,u],msgs:[],created:Date.now()};
 db.chats[id].msgs.push({f:me,t:Date.now(),r:[],sm:1,mt:'sm',sid:st.id,text:''})}

async function openStatusById(id){load();const s=db.status.find(x=>sidOf(x)===id);if(!s||Date.now()-s.t>=864e5)return toast('Status sudah tidak tersedia');if(!canSeeS(s))return toast('Status ini tidak tersedia untukmu');
 vs=visS(s.u);vi=Math.max(0,vs.findIndex(x=>sidOf(x)===id));await Promise.all(vs.filter(x=>x.mid).map(x=>murl(x.mid)));showS()}

function banner(text,fn){let b=$('#nb');if(!b){b=document.createElement('div');b.id='nb';document.body.appendChild(b)}
 b.textContent=text;b.classList.add('on');b.onclick=()=>{b.classList.remove('on');fn&&fn()};clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('on'),7000)}

const notified=new Set();
function scanTags(first){if(!me)return;let n=0,last=null;
 Object.values(db.chats).forEach(c=>{if(!c.members.includes(me))return;c.msgs.forEach(m=>{
  if(m.sm&&m.f!==me&&!(m.r||[]).includes(me)&&!(m.d||[]).includes(me)&&db.status.some(x=>sidOf(x)===m.sid&&Date.now()-x.t<864e5)){const k=c.id+':'+m.t;if(!notified.has(k));n++;last=m}}})});
 if(!n)return;const t=first&&n>1?'🏷 Kamu ditandai di '+n+' status':'🏷 @'+last.f+' menandai kamu di status';
 banner(t+' · ketuk untuk melihat',()=>{if(n>1&&first){tab='status';renderSide()}else openStatusById(last.sid)});
 try{if(window.Notification&&Notification.permission==='granted'&&document.hidden)new Notification('Hitler',{body:t})}catch(e){}}

  load();
  initAuthHandlers();
  
  let pend=(location.hash.match(/join=(\w+)/)||[])[1]||null;
  let s0=null;
  try{s0=localStorage.getItem('chatku_me')}catch(e){}
  if(s0&&db.users[s0]) start(s0);
});

addEventListener('storage',e=>{if(e.key==='chatku_db'&&me){load();scanTags(false);renderSide();renderChat()}});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
setInterval(()=>{if(me&&tab!=='acct'){load();renderSide()}},60000);
</script>
